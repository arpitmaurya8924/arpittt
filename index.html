<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Anjali ❤️ Arpit | 7 Months</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    min-height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
    radial-gradient(circle at top,#ffb6d5,transparent 35%),
    linear-gradient(135deg,#ff416c,#ff4b8b,#9b4dff);
    color:white;
}

/* Background glow */
.glow{
    position:absolute;
    width:280px;
    height:280px;
    border-radius:50%;
    background:rgba(255,255,255,.18);
    filter:blur(70px);
    animation:glow 5s infinite alternate;
}

.glow.one{
    top:-80px;
    left:-80px;
}

.glow.two{
    bottom:-80px;
    right:-80px;
    animation-delay:2s;
}

@keyframes glow{
    from{transform:scale(1)}
    to{transform:scale(1.4)}
}

/* Main card */
.card{
    position:relative;
    z-index:10;
    width:90%;
    max-width:430px;
    padding:35px 25px;
    text-align:center;
    border-radius:30px;
    background:rgba(255,255,255,.16);
    border:1px solid rgba(255,255,255,.4);
    backdrop-filter:blur(20px);
    box-shadow:0 25px 70px rgba(80,0,50,.35);
    animation:cardIn 1.2s ease;
}

@keyframes cardIn{
    from{
        opacity:0;
        transform:translateY(70px) scale(.8);
    }
    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

/* Heart */
.big-heart{
    font-size:75px;
    display:inline-block;
    animation:heartbeat 1.2s infinite;
    filter:drop-shadow(0 0 20px rgba(255,255,255,.5));
}

@keyframes heartbeat{
    0%,100%{transform:scale(1)}
    50%{transform:scale(1.2)}
}

/* Names */
.names{
    font-size:30px;
    font-weight:bold;
    margin-top:10px;
    text-shadow:0 3px 15px rgba(70,0,40,.4);
}

.and{
    color:#ffd6e6;
    font-size:18px;
}

/* Months */
.months{
    margin-top:12px;
    font-size:48px;
    font-weight:900;
    animation:shine 2s infinite;
}

@keyframes shine{
    50%{
        text-shadow:
        0 0 10px white,
        0 0 25px white;
    }
}

.subtitle{
    font-size:14px;
    opacity:.95;
    margin-top:5px;
}

/* Typing message */
.message{
    margin-top:22px;
    min-height:105px;
    line-height:1.7;
    font-size:16px;
}

/* Button */
button{
    margin-top:18px;
    padding:14px 28px;
    border:none;
    border-radius:30px;
    background:white;
    color:#ff3975;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 8px 25px rgba(0,0,0,.2);
    transition:.3s;
}

button:active{
    transform:scale(.9);
}

/* Surprise */
#surprise{
    display:none;
    margin-top:22px;
    padding:18px;
    border-radius:20px;
    background:rgba(255,255,255,.15);
    line-height:1.7;
    animation:surprise .8s ease;
}

@keyframes surprise{
    from{
        opacity:0;
        transform:scale(.7);
    }
    to{
        opacity:1;
        transform:scale(1);
    }
}

/* Floating hearts */
.heart{
    position:absolute;
    bottom:-40px;
    pointer-events:none;
    animation:floatUp linear forwards;
}

@keyframes floatUp{
    0%{
        transform:translateY(0) rotate(0);
        opacity:0;
    }

    15%{
        opacity:1;
    }

    100%{
        transform:translateY(-110vh) rotate(360deg);
        opacity:0;
    }
}

/* Stars */
.star{
    position:absolute;
    color:white;
    opacity:.7;
    animation:twinkle 2s infinite alternate;
}

@keyframes twinkle{
    from{
        opacity:.2;
        transform:scale(.6);
    }
    to{
        opacity:1;
        transform:scale(1.3);
    }
}
</style>
</head>

<body>

<div class="glow one"></div>
<div class="glow two"></div>

<div class="card">

    <div class="big-heart">❤️</div>

    <div class="names">
        Anjali <span class="and">♡</span> Arpit
    </div>

    <div class="months">
        7 Months
    </div>

    <div class="subtitle">
        Together • Forever • Always 🫂✨
    </div>

    <div class="message" id="typing"></div>

    <button onclick="surprise()">
        Tap For Your Surprise 💋
    </button>

    <div id="surprise">
        🥹❤️<br>

        <b>Anjali & Arpit</b><br><br>

        7 months of beautiful memories,<br>
        countless smiles and endless moments. 🫂💗
        <br><br>

        No matter how many days pass,<br>
        this little story will always be special. ✨
        <br><br>

        <b>Happy 7 Months Anniversary ❤️</b>
        <br>
        🫶🏻 Forever & Always 🫶🏻
    </div>

</div>

<script>

/* Typing animation */

const text =
"Anjali ❤️ Arpit — 7 months together... Every moment, every memory and every smile has made this journey special. 🫂💗";

let index = 0;

function typing(){

    if(index < text.length){

        document.getElementById("typing").innerHTML
        += text.charAt(index);

        index++;

        setTimeout(typing,35);
    }
}

typing();


/* Surprise button */

function surprise(){

    const box =
    document.getElementById("surprise");

    box.style.display="block";

    /* Heart explosion */

    for(let i=0;i<35;i++){
        createHeart();
    }
}


/* Floating hearts */

function createHeart(){

    const h =
    document.createElement("div");

    h.className="heart";

    const emojis=[
        "❤️",
        "💗",
        "💖",
        "💕",
        "💞",
        "💘",
        "🫂",
        "💋"
    ];

    h.innerHTML =
    emojis[Math.floor(Math.random()*emojis.length)];

    h.style.left =
    Math.random()*100+"vw";

    h.style.fontSize =
    (15+Math.random()*28)+"px";

    h.style.animationDuration =
    (4+Math.random()*5)+"s";

    document.body.appendChild(h);

    setTimeout(()=>{
        h.remove();
    },9000);
}


/* Continuous hearts */

setInterval(createHeart,600);


/* Stars */

for(let i=0;i<25;i++){

    const star =
    document.createElement("div");

    star.className="star";

    star.innerHTML="✦";

    star.style.left =
    Math.random()*100+"vw";

    star.style.top =
    Math.random()*100+"vh";

    star.style.fontSize =
    (8+Math.random()*12)+"px";

    star.style.animationDelay =
    Math.random()*2+"s";

    document.body.appendChild(star);
}

</script>

</body>
</html>
